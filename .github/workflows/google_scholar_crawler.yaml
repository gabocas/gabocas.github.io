name: Update OpenAlex citation count

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-citation-count:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch OpenAlex citation count
        env:
          OPENALEX_AUTHOR_ID: ${{ secrets.OPENALEX_AUTHOR_ID }}
        run: python google_scholar_crawler/main.py

      - name: Commit updated citation data
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "Citation count is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "chore: update OpenAlex citation count"
          git push
